<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Morse Code Live Translator Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }
    header { text-align: center; margin-bottom: 0.5rem; }
    header h1 { font-size: 1.8rem; color: var(--accent); margin-bottom: 0.25rem; }
    header p { color: var(--muted); font-size: 0.95rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; margin-bottom: 1rem; }
    .badge { padding: 4px 10px; border-radius: 9999px; font-weight: 600; font-size: 0.8rem; }
    .badge.connected { background: #065f46; color: #34d399; }
    .badge.disconnected { background: #7f1d1d; color: #f87171; }
    .live-display { font-size: 2.25rem; min-height: 80px; display: flex; align-items: center; justify-content: center; font-family: monospace; letter-spacing: 2px; color: var(--accent); background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px dashed var(--border); }
    .morse-preview { font-size: 1.5rem; color: #fbbf24; margin-top: 0.75rem; text-align: center; min-height: 36px; font-family: monospace; }
    .controls { display: flex; gap: 0.5rem; margin-top: 1rem; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff; }
    button { padding: 10px 16px; border-radius: 6px; border: none; background: var(--accent); color: #0f172a; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .history-list { max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem; }
    .history-item { background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; display: flex; justify-content: space-between; }
    .timestamp { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>IoT Assistive Morse Code Dashboard</h1>
      <p>Real-Time Tactile Signal Translation via ESP32 & WebSockets</p>
    </header>

    <div class="card">
      <div class="status-bar">
        <span>Connection: <strong id="connStatus">Disconnected</strong></span>
        <span class="badge disconnected" id="badge">Offline</span>
      </div>
      <div class="controls">
        <input type="text" id="espIp" placeholder="ESP32 IP Address (e.g. 192.168.1.100)">
        <button onclick="connectSocket()">Connect</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 0.5rem; font-size: 1rem; color: var(--muted);">Decoded Message Stream</h3>
      <div class="live-display" id="decodedText">—</div>
      <div class="morse-preview" id="morseCode"></div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1rem; color: var(--muted);">Message Log History</h3>
        <button style="padding: 4px 10px; font-size: 0.8rem; background: #475569; color: #fff;" onclick="clearHistory()">Clear</button>
      </div>
      <div class="history-list" id="history"></div>
    </div>
  </div>

  <script>
    let socket = null;
    const decodedElem = document.getElementById('decodedText');
    const morseElem = document.getElementById('morseCode');
    const badge = document.getElementById('badge');
    const statusText = document.getElementById('connStatus');
    const historyList = document.getElementById('history');

    function connectSocket() {
      const ip = document.getElementById('espIp').value.trim();
      if (!ip) return alert("Please enter the ESP32 IP address");

      if (socket) socket.close();
      socket = new WebSocket(`ws://${ip}/ws`);

      socket.onopen = () => {
        statusText.innerText = "Connected to " + ip;
        badge.innerText = "Online";
        badge.className = "badge connected";
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'morse') {
            morseElem.innerText = data.value ? `Input: ${data.value}` : '';
          } else if (data.type === 'message' || data.type === 'sync') {
            decodedElem.innerText = data.value || data.message || '—';
            if (data.value && data.value.endsWith(' ')) {
              addHistory(data.value.trim());
            }
          }
        } catch(e) { console.error(e); }
      };

      socket.onclose = () => {
        statusText.innerText = "Disconnected";
        badge.innerText = "Offline";
        badge.className = "badge disconnected";
      };
    }

    function addHistory(msg) {
      if (!msg) return;
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<span>${msg}</span><span class="timestamp">${new Date().toLocaleTimeString()}</span>`;
      historyList.prepend(item);
    }

    function clearHistory() {
      historyList.innerHTML = '';
    }
  </script>
</body>
</html>
